buildscript {
	repositories {
		maven { url 'https://maven.aliyun.com/repository/public' }
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:1.15.5"
	}
}

plugins {
	id 'maven-publish'
}

def minecraftVer = stonecutter.current.version
version = project.mod_version

if (stonecutter.eval(minecraftVer, ">=26.1")) {
	apply plugin: 'net.fabricmc.fabric-loom'
} else {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
}


base {
	archivesName = "${project.archives_base_name}-${minecraftVer}"

}


repositories {
	maven {
		url 'https://masa.dy.fi/maven'

	}
	maven{
		url "https://api.modrinth.com/maven"
	}
	maven {
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		url = 'https://masa.dy.fi/maven'
	}
	maven {
		url = 'https://repo1.maven.org/maven2'
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		url = 'https://maven.fallenbreath.me/jitpack'
		content { includeGroupAndSubgroups('com.github') }
	}
	maven { url = "https://maven.bawnorton.com/releases" }
	maven {url = 'https://maven.fallenbreath.me/releases'
		content {includeGroupAndSubgroups("me.fallenbreath")}
	}
	maven {
		url = 'https://www.cursemaven.com'
		content { includeGroup('curse.maven') }
	}
	maven {url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc")}
	}
	maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url = 'https://maven.nucleoid.xyz/' }
	maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
		content {includeGroupAndSubgroups("fi.dy.masa")}
	}
	maven {
		url = 'https://jitpack.io'
	}
}


stonecutter {
	// Subproject configuration

	// The active node (26.1) copies src/ verbatim, so the access widener has to stay in the
	// 26.x form there; every older node is remapped and needs the "named" namespace instead.
	replacements.string(current.parsed < "26.1") {
		replace(
				"classTweaker v1 official",
				"classTweaker v1 named"
		)
	}

	// Version-difference convention (keep it this way):
	//   * an API that differs in 5+ places -> a Helper in com.carpet.rof.utils (see ChunkPosHelper)
	//   * import paths -> a global replacement (an import path is unique, so the reverse pass on
	//                     the other nodes finds nothing)
	//   * everything else -> region-scoped Local Replacement in the source
	//                        (//~ if <cond> 'from' -> 'to' { ... //~})
	// Never register a global replacement for a plain member/call rename: Stonecutter applies it
	// in reverse on the other nodes too, and the reverse string usually exists there.
	replacements.string(current.parsed >= "26.2") {
		replace("net.minecraft.advancements.criterion.", "net.minecraft.advancements.triggers.")
	}

	// 1.21.11 renamed / split these APIs; the 1.21.10 node still uses the old locations.
	// Exact names (never a package prefix) on purpose: a prefix rule such as
	// "net.minecraft.world.level.gamerules." -> "net.minecraft.world.level." would reverse-match
	// every other "net.minecraft.world.level.*" import once the newer nodes are generated.
	replacements.string(current.parsed < "1.21.11") {
		replace(
				"net.minecraft.world.entity.projectile.throwableitemprojectile.ThrownEnderpearl",
				"net.minecraft.world.entity.projectile.ThrownEnderpearl"
		)
		replace(
				"net.minecraft.world.entity.projectile.throwableitemprojectile.ThrowableItemProjectile",
				"net.minecraft.world.entity.projectile.ThrowableItemProjectile"
		)
		// the same classes appear as mixin @At descriptors (slash form)
		replace(
				"Lnet/minecraft/world/entity/projectile/throwableitemprojectile/ThrownEnderpearl;",
				"Lnet/minecraft/world/entity/projectile/ThrownEnderpearl;"
		)
		replace(
				"Lnet/minecraft/world/entity/projectile/throwableitemprojectile/ThrowableItemProjectile;",
				"Lnet/minecraft/world/entity/projectile/ThrowableItemProjectile;"
		)
		replace("net.minecraft.advancements.criterion.", "net.minecraft.advancements.critereon.")
		replace("Lnet/minecraft/advancements/criterion/", "Lnet/minecraft/advancements/critereon/")
		replace("net.minecraft.world.level.gamerules.GameRules", "net.minecraft.world.level.GameRules")
		replace("net.minecraft.resources.Identifier", "net.minecraft.resources.ResourceLocation")
		// the simple name changed too; the source uses it in exactly 3 places (all standalone)
		replace("Identifier", "ResourceLocation")
	}

}

def awFile = sc.process(
		rootProject.file("src/main/resources/CarpetRofAddition.aw"),
		".gradle/CarpetRofAddition.processed.aw"
)


loom {
	accessWidenerPath = awFile

	splitEnvironmentSourceSets()

	mods {
		"rof_carpet_addition" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runConfigs.all {
		ideConfigGenerated true // Run configurations are not created for subprojects by default
		runDir "../../run" // Use a shared run folder and create separate worlds
	}

	def auditVmArgs = ['-Dcarpetrofaddition.mixin_audit=true']

	runs {
		serverMixinAudit {
			server()
			vmArgs auditVmArgs
			ideConfigGenerated false
		}
		clientMixinAudit {
			client()
			vmArgs auditVmArgs
			ideConfigGenerated false
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file

	minecraft "com.mojang:minecraft:${stonecutter.current.project}"
	if (!stonecutter.eval(minecraftVer, ">=26.1")) {
		mappings loom.officialMojangMappings()
	}
	if (stonecutter.eval(minecraftVer, ">=26.1")) {
		implementation "net.fabricmc:fabric-loader:${property("loader_version")}"
		//implementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_api_version")}"
		implementation "carpet:fabric-carpet:${property("carpet_core_version")}"
		implementation "maven.modrinth:lithium:${property("lithium_version")}"
	} else {
		modImplementation "net.fabricmc:fabric-loader:${property("loader_version")}"
		//modImplementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_api_version")}"
		modImplementation "carpet:fabric-carpet:${property("carpet_core_version")}"
		modImplementation "maven.modrinth:lithium:${property("lithium_version")}"
	}
	implementation 'it.unimi.dsi:fastutil:8.5.18'
	implementation 'org.jspecify:jspecify:1.0.0'
	annotationProcessor project(":processor")
	compileOnly project(":processor")
}

processResources {
	inputs.property "minecraft", stonecutter.current.version

	filesMatching("fabric.mod.json") {
		expand( [
				"minecraftVer": project.findProperty("minecraft_ver") ?: stonecutter.current.version,
				"modVer": mod_version
				])

	}
}

def javaVersion = stonecutter.eval(minecraftVer, ">=26.1") ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21

java {
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

jar {
	inputs.property "archivesName", "${project.base.archivesName}-${minecraftVer}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {

	}
}



tasks.withType(JavaCompile).configureEach {
	//exclude("**/Dosc.java")
}
