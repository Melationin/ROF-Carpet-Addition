plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def minecraftVer = stonecutter.current.version
def accesswidener = stonecutter.eval(minecraftVer, ">=1.21") ? stonecutter.eval(minecraftVer, ">=26.2") ? "26_2.accesswidener" : "1_21_4.accesswidener"
		: stonecutter.eval(minecraftVer, ">=1.20") ? "1.20.accesswidener"
		: "1.19.accesswidener"


base {
	archivesName = "${project.archives_base_name}-${minecraftVer}"

}


repositories {
	maven {
		url 'https://masa.dy.fi/maven'

	}
	maven{
		url "https://api.modrinth.com/maven"
	}
	maven {
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		url = 'https://masa.dy.fi/maven'
	}
	maven {
		url = 'https://repo1.maven.org/maven2'
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		url = 'https://maven.fallenbreath.me/jitpack'
		content { includeGroupAndSubgroups('com.github') }
	}
	maven { url = "https://maven.bawnorton.com/releases" }
	maven {url = 'https://maven.fallenbreath.me/releases'
		content {includeGroupAndSubgroups("me.fallenbreath")}
	}
	maven {
		url = 'https://www.cursemaven.com'
		content { includeGroup('curse.maven') }
	}
	maven {url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc")}
	}
	maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url = 'https://maven.nucleoid.xyz/' }
	maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
		content {includeGroupAndSubgroups("fi.dy.masa")}
	}
	maven {
		url = 'https://jitpack.io'
	}
}

loom {
	accessWidenerPath = rootProject.file("src/main/resources/accesswideners/${accesswidener}")

	splitEnvironmentSourceSets()

	mods {
		"rof_carpet_addition" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runConfigs.all {
		ideConfigGenerated true // Run configurations are not created for subprojects by default
		runDir "../../run" // Use a shared run folder and create separate worlds
	}

}

dependencies {
	// To change the versions see the gradle.properties file

	minecraft "com.mojang:minecraft:${stonecutter.current.project}"
	implementation "net.fabricmc:fabric-loader:${property("loader_version")}"
	implementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_api_version")}"
	implementation "carpet:fabric-carpet:${property("carpet_core_version")}"
	implementation 'it.unimi.dsi:fastutil:8.5.18'
	// Async random-tick planning uses Lithium's published section indexes.  The
	// mod is intentionally not bundled; servers enabling that rule must provide it.
	implementation "maven.modrinth:lithium:${property("lithium_version")}"
	//mappings loom.officialMojangMappings()
	annotationProcessor project(":processor")
	compileOnly project(":processor")
}

processResources {
	inputs.property "minecraft", stonecutter.current.version

	filesMatching("fabric.mod.json") {
		expand( [
				"minecraftVer": stonecutter.current.version,
				aw_file: accesswidener,
				"modVer": mod_version
				])

	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", "${project.base.archivesName}-${minecraftVer}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {

	}
}

stonecutter {
	// Subproject configuration
}

tasks.withType(JavaCompile).configureEach {
	//exclude("**/Dosc.java")
}
