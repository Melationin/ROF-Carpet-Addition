# 每次推送和提交的 pull request 都会自动构建项目并运行已配置的测试。
# 这有助于发现只在特定平台或 Java 版本上才会出现的问题，
# 也是防止坏提交进入代码库的第一道防线。

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: Run Mixin Audit Check
        timeout-minutes: 10
        run: |
          mkdir -p ./run
          echo eula=true > ./run/eula.txt
          ./gradlew --no-parallel runClientMixinAudit
      - name: collect build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/rof-artifacts"
          for jar in versions/*/build/libs/*.jar; do
            target="$RUNNER_TEMP/rof-artifacts/$(basename "$jar")"
            if [ -e "$target" ]; then
              echo "Duplicate artifact name: $(basename "$jar")" >&2
              exit 1
            fi
            cp "$jar" "$target"
          done
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ${{ runner.temp }}/rof-artifacts/*.jar
          if-no-files-found: error
